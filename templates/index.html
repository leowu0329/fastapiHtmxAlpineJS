<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>產品管理系統 - FastAPI + HTMX + Alpine.js</title>

    <!-- 本地 CSS (Bootstrap 5 & Font Awesome 6) -->
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/all.min.css">

    <!-- Google Fonts (Noto Sans TC & Roboto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- HTMX & Alpine.js CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body {
            font-family: 'Roboto', 'Noto Sans TC', sans-serif;
            background-color: #f8f9fa;
        }

        .table-action-btn {
            width: 32px;
            height: 32px;
            padding: 0;
            line-height: 30px;
            text-align: center;
        }
    </style>
</head>

<body class="p-2 p-sm-4" x-data="crudModal()">
    <div class="container-fluid container-md bg-white p-3 p-sm-4 rounded shadow-sm">
        <!-- 頂部標題與操作區 (PC 模式 4/12 靠左、3/12 靠右) -->
        <div class="row align-items-center mb-4 g-3">
            <!-- 左側 4/12：產品管理系統 (含 logo) -->
            <div class="col-12 col-md-4">
                <h2 class="fw-bold text-primary mb-0 h4 h2-sm d-flex align-items-center">
                    <i class="fa-solid fa-box-open me-2 fs-3"></i>產品管理系統
                </h2>
            </div>

            <!-- 中間留空自動擠壓 -->
            <div class="d-none d-md-block col-md-5"></div>

            <!-- 右側 3/12：新增產品按鈕 (靠右對齊) -->
            <div class="col-12 col-md-3 text-start text-md-end">
                <button class="btn btn-primary w-100 w-md-auto px-3 py-2" x-on:click="openCreateModal()">
                    <i class="fa-solid fa-plus me-1"></i> 新增產品
                </button>
            </div>
        </div>

        <!-- HTMX 動態加載表格區域 -->
        <div id="table-container" hx-get="/items/list" hx-trigger="refreshTable from:body">
            {% include "components/item_table.html" %}
        </div>
    </div>

    <!-- 引入 Modal 組件 -->
    {% include "components/item_modal.html" %}
    {% include "components/delete_modal.html" %}
    {% include "components/category_modal.html" %}

    <!-- 本地 JS Dependencies (Bootstrap 5) -->
    <script src="/static/js/bootstrap.bundle.min.js"></script>

    <!-- Alpine.js 與事件控制腳本 -->
    <script>
        document.addEventListener('htmx:afterSettle', function (evt) {
            if (window.Alpine) {
                Alpine.initTree(evt.detail.target);
            }
        });

        function crudModal() {
            return {
                modalObj: null,
                deleteModalObj: null,
                categoryModalObj: null,
                isEdit: false,
                form: { id: null, name: '', category: '雜項', price: '', description: '' },
                deleteItemTarget: { id: null, name: '' },
                newCategoryName: '',

                init() {
                    this.modalObj = new bootstrap.Modal(this.$refs.modalElement);
                    this.deleteModalObj = new bootstrap.Modal(this.$refs.deleteModalElement);
                    this.categoryModalObj = new bootstrap.Modal(this.$refs.categoryModalElement);
                },
                openCreateModal() {
                    this.isEdit = false;
                    this.form = { id: null, name: '', category: '雜項', price: '', description: '' };
                    this.modalObj.show();
                },
                openEditModalFromEl(el) {
                    this.isEdit = true;
                    this.form = {
                        id: el.dataset.id,
                        name: el.dataset.name,
                        category: el.dataset.category || '雜項',
                        price: el.dataset.price,
                        description: el.dataset.description
                    };
                    this.modalObj.show();
                },
                openDeleteModalFromEl(el) {
                    this.deleteItemTarget = {
                        id: el.dataset.id,
                        name: el.dataset.name
                    };
                    this.deleteModalObj.show();
                },
                openCategoryManagerModal() {
                    this.categoryModalObj.show();
                },
                closeModal() {
                    this.modalObj.hide();
                },
                async confirmDelete() {
                    if (!this.deleteItemTarget.id) return;

                    try {
                        const response = await fetch(`/api/items/${this.deleteItemTarget.id}`, { method: 'DELETE' });
                        if (response.ok) {
                            this.deleteModalObj.hide();
                            this.deleteItemTarget = { id: null, name: '' };
                            htmx.trigger('#table-container', 'refreshTable');
                        } else { alert('刪除失敗，請重試'); }
                    } catch (err) { console.error(err); alert('刪除請求發送失敗'); }
                },
                async submitForm(event) {
                    const formData = new FormData(event.target);
                    const url = this.isEdit ? `/api/items/${this.form.id}` : '/api/items';
                    const method = this.isEdit ? 'PUT' : 'POST';

                    try {
                        const response = await fetch(url, { method: method, body: formData });
                        if (response.ok) {
                            this.closeModal();
                            htmx.trigger('#table-container', 'refreshTable');
                        } else { alert('操作失敗，請重試'); }
                    } catch (err) { console.error(err); alert('傳送發生錯誤'); }
                },
                async submitCategoryForm(event) {
                    const formData = new FormData(event.target);
                    try {
                        const response = await fetch('/api/categories', { method: 'POST', body: formData });
                        if (response.ok) {
                            this.newCategoryName = '';
                            htmx.trigger('#category-list-container', 'refreshCategories');
                        } else {
                            const errData = await response.json().catch(() => ({}));
                            alert(errData.detail || '新增分類失敗');
                        }
                    } catch (err) { console.error(err); alert('網路請求失敗'); }
                },
                async deleteCategory(id) {
                    if (!confirm('確定刪除此分類嗎？')) return;
                    try {
                        const response = await fetch(`/api/categories/${id}`, { method: 'DELETE' });
                        if (response.ok) {
                            htmx.trigger('#category-list-container', 'refreshCategories');
                        } else { alert('刪除分類失敗'); }
                    } catch (err) { console.error(err); }
                }
            }
        }
    </script>
</body>

</html>
