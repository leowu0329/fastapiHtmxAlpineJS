<div class="modal fade" id="categoryModal" tabindex="-1" aria-hidden="true" x-ref="categoryModalElement">
    <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold"><i class="fa-solid fa-tags me-2"></i>分類管理</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- 新增分類表單 (RWD Flex) -->
                <form @submit.prevent="submitCategoryForm($event)" class="mb-4">
                    <label class="form-label fw-bold">新增新分類</label>
                    <div class="input-group flex-column flex-sm-row gap-2 gap-sm-0">
                        <input type="text" name="name" class="form-control w-100 w-sm-auto rounded-start-sm" x-model="newCategoryName" placeholder="輸入分類名稱..." required>
                        <button class="btn btn-primary w-100 w-sm-auto rounded-end-sm" type="submit">
                            <i class="fa-solid fa-plus me-1"></i>新增
                        </button>
                    </div>
                </form>

                <!-- HTMX 分類列表區塊（動態自訂高度與滾動條） -->
                <label class="form-label fw-bold">現有分類列表</label>
                <div id="category-list-container" 
                     class="border rounded p-1"
                     style="max-height: 50vh; min-height: 150px; overflow-y: auto;"
                     hx-get="/categories/options" 
                     hx-trigger="refreshCategories from:body">
                    {% include "components/category_list.html" %}
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary w-100 w-sm-auto" data-bs-dismiss="modal">關閉</button>
            </div>
        </div>
    </div>
</div>
